<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BYC 2026 Results</title>
<meta name="description" content="Leaders-only live results for the BYC 2026 Conference Review">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111112">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="BYC26 Results">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{color-scheme:dark;--ink:#111112;--panel:#18181a;--line:#454348;--text:#f3f2f2;--muted:#a9a6aa;--red:#c8102e}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:"Poppins","Century Gothic","Trebuchet MS",sans-serif}
body{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.splash{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center}
.splash img{width:150px;border-radius:28px}
.splash p{margin:0;color:var(--muted);font-size:.9rem;font-weight:300}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.25;transform:scale(.7)}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
iframe{position:relative;display:block;width:100%;height:100%;border:0;background:transparent}
.bar{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;
  display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 12px 30px rgba(0,0,0,.6);font-size:.86rem;max-width:520px;margin:0 auto}
.bar img{width:36px;height:36px;border-radius:9px;flex:none}
.bar span{flex:1;min-width:0}
.bar b{font-weight:500}
.bar button{font:inherit;border-radius:999px;cursor:pointer;padding:8px 14px}
.install{background:var(--red);border:1px solid var(--red);color:#fff;font-weight:500}
.close{background:none;border:0;color:var(--muted);font-size:1.2rem;padding:4px 8px!important}
.offline{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:6;background:var(--red);color:#fff;border-radius:999px;padding:6px 14px;font-size:.8rem}
</style>
</head>
<body>
<div class="splash" aria-hidden="true"><img src="icons/icon-192.png" alt=""><div class="dot"></div><p>Loading BYC 2026 Results…</p></div>
<iframe id="app" title="BYC 2026 Results dashboard" src="https://script.google.com/macros/s/AKfycbwJLUvS0891VB07GffARzem_0s5PzCmeIupD80uB-xm8Q4v_xxqpJISf_UlTggerzGO/exec" allow="clipboard-write"></iframe>

<div class="bar" id="installBar" hidden role="region" aria-label="Install app">
  <img src="icons/icon-192.png" alt="">
  <span id="installText"><b>Install BYC26 Results</b><br>Open it from your home screen like an app.</span>
  <button class="install" id="installBtn" type="button">Install</button>
  <button class="close" id="closeBar" type="button" aria-label="Not now">✕</button>
</div>
<div class="offline" id="offline" hidden>You're offline. Results will load when you reconnect.</div>

<script>
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const bar = document.getElementById("installBar"), btn = document.getElementById("installBtn");
let dismissed = false;
try { dismissed = localStorage.getItem("byc26-install-dismissed") === "1"; } catch (e) {}
let promptEvent = null;

window.addEventListener("beforeinstallprompt", e => {          // Android / desktop Chrome & Edge
  e.preventDefault(); promptEvent = e;
  if (!standalone && !dismissed) bar.hidden = false;
});
btn.addEventListener("click", async () => {
  if (!promptEvent) return;
  promptEvent.prompt();
  await promptEvent.userChoice.catch(() => null);
  promptEvent = null; bar.hidden = true;
});
if (isIOS && !standalone && !dismissed) {                       // iPhone: Safari has no install button, so explain the two taps
  document.getElementById("installText").innerHTML = "<b>Install BYC26 Results</b><br>Tap <b>Share</b> (□↑), then <b>Add to Home Screen</b>.";
  btn.hidden = true; bar.hidden = false;
}
document.getElementById("closeBar").addEventListener("click", () => {
  bar.hidden = true;
  try { localStorage.setItem("byc26-install-dismissed", "1"); } catch (e) {}
});
window.addEventListener("appinstalled", () => { bar.hidden = true; });

const off = document.getElementById("offline");
const net = () => { off.hidden = navigator.onLine; };
addEventListener("online", () => { net(); document.getElementById("app").src = document.getElementById("app").src; });
addEventListener("offline", net); net();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
